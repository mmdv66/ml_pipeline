data:
  path: data/raw/train.csv
  target_col: target
  test_size: 0.2
  random_state: 42
model:
  _target_: sklearn.ensemble.RandomForestClassifier
  name: random_forest
  n_estimators: 100
  max_depth: 10
  min_samples_split: 5
  random_state: 42
  n_jobs: -1
encoder:
  _target_: sklearn.preprocessing.OneHotEncoder
  handle_unknown: ignore
  sparse_output: false
training:
  cv_folds: 5
  scoring: roc_auc
  register_model: false
  model_stage: Staging
project:
  name: sber_ml_pipeline
  experiment_name: credit_scoring
mlflow:
  tracking_uri: sqlite:///mlflow.db
